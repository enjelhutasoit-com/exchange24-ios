name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Swift version
        run: swift --version

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Exchange24iOS.xcodeproj \
            -scheme Exchange24iOS

      - name: Build
        run: |
          xcodebuild build \
            -project Exchange24iOS.xcodeproj \
            -scheme Exchange24iOS \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -project Exchange24.xcodeproj \
            -scheme Exchange24 \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO
